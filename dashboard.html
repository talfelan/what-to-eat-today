<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>看板 · 今天吃什么</title>
<style>
  :root { --brand:#ff6b35; --line:#e6e6e6; --muted:#8a8a8a; --card:#fff; --bg:#faf7f4; --bar:#ffb37a; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; color:#232323; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:12px; margin:0 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  input, select { min-height:44px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; flex:1 1 220px; }
  button { min-height:44px; padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:#fff; font:inherit; cursor:pointer; }
  button.primary { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { font-size:12px; color:var(--muted); font-weight:600; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .status { min-height:20px; font-size:12px; color:var(--brand); margin:8px 0 0; }
  .muted { color:var(--muted); }
  .kpis { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:10px; }
  .kpi { flex:1 1 90px; }
  .kpi b { display:block; font-size:20px; }
  .kpi span { font-size:12px; color:var(--muted); }
  .chart { display:flex; align-items:flex-end; gap:4px; height:120px; margin-top:6px; }
  .chart .col { flex:1 1 0; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px; min-width:0; }
  .chart .bar { width:100%; background:var(--bar); border-radius:4px 4px 0 0; min-height:2px; }
  .chart .day { font-size:10px; color:var(--muted); white-space:nowrap; }
  h2 { font-size:13px; color:var(--muted); margin:0 0 6px; font-weight:600; }
  #gate { display:block; }
  #main { display:none; }
</style>
</head>
<body>
<h1>看板 · 今天吃什么</h1>
<p class="sub">匿名汇总（只进不出）。口令只存在你这台浏览器里，不会出现在网址里。</p>

<!-- 门禁：第一次进来要填「上报端点」和「看板口令」，之后浏览器自己记住 -->
<section class="card" id="gate">
  <div class="row">
    <input id="in-endpoint" type="url" placeholder="上报端点，例如 https://xxx.workers.dev/report" autocomplete="off">
  </div>
  <div class="row" style="margin-top:10px">
    <input id="in-token" type="password" placeholder="看板口令" autocomplete="off">
    <button id="btn-enter" class="primary" type="button">进入看板</button>
  </div>
  <p class="status" id="gate-status" role="status" aria-live="polite"></p>
</section>

<section id="main">
  <div class="card">
    <div class="row">
      <select id="sel-days">
        <option value="1">今天</option>
        <option value="7" selected>最近 7 天</option>
        <option value="30">最近 30 天</option>
        <option value="90">最近 90 天</option>
      </select>
      <button id="btn-refresh" type="button">刷新</button>
      <button id="btn-csv" type="button">导出 CSV</button>
      <button id="btn-selectall" type="button">全选</button>
      <button id="btn-selectnone" type="button">全不选</button>
      <button id="btn-delselected" type="button" disabled>删除选中</button>
      <button id="btn-delall" type="button">删除全部</button>
      <button id="btn-logout" type="button">退出口令</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>

  <div class="card">
    <h2>总览</h2>
    <div class="kpis" id="kpis"></div>
    <h2>按天趋势（窗口内）</h2>
    <div class="chart" id="chart"></div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th style="width:36px"><input type="checkbox" id="chk-all" aria-label="全选"></th>
          <th>菜品</th><th class="num">净红心</th><th class="num">净踩</th><th class="num">总次数</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <p class="muted" id="empty" hidden>这个时间窗口里还没有任何反馈。</p>
  </div>
</section>

<script>
(function () {
  const LS = { endpoint: 'whatToEat.dash.endpoint', token: 'whatToEat.dash.token', days: 'whatToEat.dash.days' };
  const $ = (id) => document.getElementById(id);
  let rows = [];
  let byDay = [];
  let names = {};

  const apiBase = (endpoint) => String(endpoint || '').replace(/\/report\/?$/, '');
  const getEndpoint = () => localStorage.getItem(LS.endpoint) || '';

  /**
   * 默认端点：**能从自己的地址推出来就自动填**，省掉每次手打。
   *   · 页面由 Worker 自己服务（*.workers.dev）⇒ 直接用它自己的 /report
   *   · 页面放在站点上（GitHub Pages / Netlify）⇒ 用内置的默认 Worker 地址
   * 用户只需要填一次口令；端点和口令都存这台浏览器的 localStorage，之后不再问。
   */
  const DEFAULT_ENDPOINT = (() => {
    const host = String(location.hostname || '');
    if (/workers\.dev$/.test(host)) return `${location.origin}/report`;
    return 'https://what-to-eat-feedback.talfelan.workers.dev/report';
  })();
  const getToken = () => localStorage.getItem(LS.token) || '';

  /* 兼容 Netlify 那套习惯：可用 #token=…&endpoint=… 进来一次（用完立即从地址栏抹掉，不留痕） */
  function absorbHash() {
    const raw = location.hash.replace(/^#/, '');
    if (!raw) return false;
    const p = new URLSearchParams(raw);
    const t = p.get('token');
    const e = p.get('endpoint') || p.get('url');
    let used = false;
    if (t) { localStorage.setItem(LS.token, t); used = true; }
    if (e) { localStorage.setItem(LS.endpoint, e); used = true; }
    if (used) history.replaceState(null, '', location.pathname);
    return used;
  }

  async function loadNames() {
    try { names = await (await fetch('dish-names.json')).json(); } catch { names = {}; }
  }

  function renderKpis() {
    const total = rows.reduce((a, r) => a + r.total, 0);
    const likes = rows.reduce((a, r) => a + r.like, 0);
    const dislikes = rows.reduce((a, r) => a + r.dislike, 0);
    $('kpis').innerHTML = '';
    [['总反馈', total], ['红心', likes], ['踩', dislikes], ['有反馈的菜', rows.length]].forEach(([label, v]) => {
      const d = document.createElement('div');
      d.className = 'kpi';
      const b = document.createElement('b');
      b.textContent = String(v);
      const s = document.createElement('span');
      s.textContent = label;
      d.append(b, s);
      $('kpis').appendChild(d);
    });
  }

  function renderChart() {
    const box = $('chart');
    box.textContent = '';
    const max = Math.max(1, ...byDay.map((d) => d.total));
    byDay.forEach((d) => {
      const col = document.createElement('div');
      col.className = 'col';
      const bar = document.createElement('div');
      bar.className = 'bar';
      bar.style.height = `${Math.round((d.total / max) * 100)}%`;
      bar.title = `${d.day}：${d.total} 条`;
      const lab = document.createElement('div');
      lab.className = 'day';
      lab.textContent = d.day.slice(5);
      col.append(bar, lab);
      box.appendChild(col);
    });
    if (!byDay.length) box.textContent = '（窗口内暂无数据）';
  }

  function renderTable() {
    const tbody = $('tbody');
    tbody.textContent = '';
    $('empty').hidden = rows.length > 0;
    rows.forEach((r) => {
      const tr = document.createElement('tr');
      const td0 = document.createElement('td');
      const chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.dataset.id = r.dishId;
      chk.addEventListener('change', updateButtons);
      td0.appendChild(chk);
      tr.appendChild(td0);
      const tdName = document.createElement('td');
      tdName.textContent = names[r.dishId] || r.dishId;
      tr.appendChild(tdName);
      [r.net, r.netDown, r.total].forEach((v) => {
        const td = document.createElement('td');
        td.className = 'num';
        td.textContent = String(v);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    updateButtons();
  }

  const boxes = () => [...document.querySelectorAll('#tbody input[type=checkbox]')];
  const selected = () => boxes().filter((b) => b.checked).map((b) => b.dataset.id);

  function updateButtons() {
    const n = selected().length;
    $('btn-delselected').disabled = n === 0;
    $('btn-delselected').textContent = n ? `删除选中（${n}）` : '删除选中';
    $('chk-all').checked = n > 0 && n === boxes().length;
    setStatus(n ? `已选 ${n} 条` : '');
  }

  function setStatus(text) { $('status').textContent = text || ''; }

  async function fetchData() {
    const days = $('sel-days').value;
    localStorage.setItem(LS.days, days);
    setStatus('读取中…');
    try {
      const r = await fetch(`${apiBase(getEndpoint())}/api/data?days=${days}`, {
        headers: { 'x-operator-token': getToken() },
      });
      if (r.status === 404) { setStatus('口令不对（服务端一律回 404）'); return; }
      if (!r.ok) { setStatus(`读取失败：${r.status}`); return; }
      const j = await r.json();
      rows = j.rows || [];
      byDay = j.byDay || [];
      renderKpis();
      renderChart();
      renderTable();
      setStatus(`共 ${rows.length} 道菜有反馈（窗口 ${days} 天）`);
    } catch (e) { setStatus('网络或跨域失败：' + (e && e.message)); }
  }

  function exportCsv() {
    const head = ['dishId', '菜名', '净红心', '净踩', '总次数', '红心', '撤销红心', '差评', '撤销差评'];
    const lines = [head.join(',')];
    rows.forEach((r) => {
      const name = String(names[r.dishId] || '').replace(/"/g, '""');
      lines.push([r.dishId, `"${name}"`, r.net, r.netDown, r.total, r.like, r.unlike, r.dislike, r.undislike].join(','));
    });
    lines.push('');
    lines.push(['day', '总数'].join(','));
    byDay.forEach((d) => lines.push([d.day, d.total].join(',')));
    const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `what-to-eat-feedback-${$('sel-days').value}d.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setStatus('已导出 CSV');
  }

  async function del(body) {
    const days = $('sel-days').value;
    const r = await fetch(`${apiBase(getEndpoint())}/api/delete`, {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-operator-token': getToken() },
      body: JSON.stringify({ ...body, days: Number(days) }),
    });
    const j = await r.json().catch(() => ({}));
    setStatus(r.ok ? `已删除 ${j.deleted || 0} 条` : `删除失败：${r.status}`);
    await fetchData();
  }

  function showMain() {
    $('gate').style.display = 'none';
    $('main').style.display = 'block';
    $('sel-days').value = localStorage.getItem(LS.days) || '7';
    fetchData();
  }

  $('btn-enter').addEventListener('click', () => {
    const ep = $('in-endpoint').value.trim() || DEFAULT_ENDPOINT;
    const tk = $('in-token').value.trim();
    if (!tk) { $('gate-status').textContent = '填一下口令就行（端点已自动填好）'; return; }
    localStorage.setItem(LS.endpoint, ep);
    localStorage.setItem(LS.token, tk);
    showMain();
  });
  $('btn-refresh').addEventListener('click', fetchData);
  $('btn-csv').addEventListener('click', exportCsv);
  $('sel-days').addEventListener('change', fetchData);
  $('chk-all').addEventListener('change', (e) => { boxes().forEach((b) => { b.checked = e.target.checked; }); updateButtons(); });
  $('btn-selectall').addEventListener('click', () => { boxes().forEach((b) => { b.checked = true; }); updateButtons(); });
  $('btn-selectnone').addEventListener('click', () => { boxes().forEach((b) => { b.checked = false; }); updateButtons(); });
  $('btn-delselected').addEventListener('click', () => {
    const ids = selected();
    if (!ids.length) return;
    if (!confirm(`删除选中的 ${ids.length} 道菜在窗口内的全部反馈？`)) return;
    del({ dishIds: ids });
  });
  $('btn-delall').addEventListener('click', () => {
    if (!confirm('删除窗口内全部反馈？此操作不可撤销。')) return;
    del({ all: true });
  });
  $('btn-logout').addEventListener('click', () => {
    localStorage.removeItem(LS.token);
    localStorage.removeItem(LS.endpoint);
    $('in-endpoint').value = '';
    $('in-token').value = '';
    $('main').style.display = 'none';
    $('gate').style.display = 'block';
    $('gate-status').textContent = '已清掉本机保存的口令';
  });

  loadNames();
  absorbHash();
  if (!getEndpoint()) localStorage.setItem(LS.endpoint, DEFAULT_ENDPOINT);   // 端点自动就位
  $('in-endpoint').value = getEndpoint();
  if (getToken()) showMain();                                               // 有口令就直接进，不再问第二次
  else $('gate-status').textContent = '只需填一次口令；之后这台浏览器会记住，不再问。';
})();
</script>
</body>
</html>
